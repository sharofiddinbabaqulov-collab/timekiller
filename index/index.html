<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Time Killer</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#222;
    color:white;
    text-align:center;
}

h1{
    margin:15px;
}

#game{
    width:95vw;
    height:80vh;
    margin:auto;
    background:#444;
    border-radius:15px;
    position:relative;
    overflow:hidden;
    border:3px solid #00ff99;
}

#score{
    font-size:28px;
    padding:10px;
    font-weight:bold;
}

#target{
    width:60px;
    height:60px;
    background:red;
    border-radius:50%;
    position:absolute;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 0 15px red;
}

#target:active{
    transform:scale(.9);
}

@media(max-width:600px){
    #target{
        width:70px;
        height:70px;
    }
}
</style>

</head>
<body>

<h1>🎯 Time Killer</h1>

<div id="game">
    <div id="score">Ball: 0</div>
    <div id="target"></div>
</div>

<script>
const target = document.getElementById("target");
const scoreText = document.getElementById("score");
const game = document.getElementById("game");

let score = 0;

function moveTarget(){

    let x = Math.random() * (game.clientWidth - target.offsetWidth);
    let y = Math.random() * (game.clientHeight - target.offsetHeight);

    target.style.left = x + "px";
    target.style.top = y + "px";
}

target.addEventListener("click",()=>{

    score++;

    scoreText.innerHTML = "Ball: " + score;

    moveTarget();

});

moveTarget();

setInterval(moveTarget,1200);
</script>

</body>
</html>
